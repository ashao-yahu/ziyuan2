<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>建站七步骤</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
html{scroll-behavior:smooth;}
body{
    background: linear-gradient(180deg,#020108 0%,#1a0c33 50%,#05020e 100%);
    color:#fff;
    overflow-x:hidden;
}
.section{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}
.step-box{
    width:100%;
    max-width:780px;
    padding:48px 36px;
    border-radius:22px;
    background:linear-gradient(135deg,rgba(120,40,200,0.22),rgba(40,20,90,0.28));
    border:1px solid rgba(160,100,255,0.3);
    backdrop-filter:blur(12px);
    opacity:0;
    transform:translateY(140px) scale(0.88);
}
.step-num{
    text-align:center;
    font-size:18px;
    color:#d8b8ff;
    margin-bottom:16px;
    letter-spacing:2px;
}
.step-title{
    text-align:center;
    font-size:42px;
    font-family:"Noto Sans SC Black","SimHei","黑体",sans-serif;
    font-weight:900;
    margin-bottom:24px;
    color:#f3e8ff;
}
.step-text{
    text-align:center;
    font-size:22px;
    font-family:"KaiTi","楷体_GB2312","STKaiti",serif;
    color:#e2ccff;
    line-height:2;
}
@media(max-width:600px){
    .step-title{font-size:28px;}
    .step-text{font-size:18px;}
    .step-box{padding:32px 20px;}
}
</style>
</head>
<body>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 1</div>
        <h2 class="step-title">需求梳理</h2>
        <div class="step-text">确定网站用途、页面功能、访问人群，整理需要展示的内容与交互。</div>
    </div>
</section>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 2</div>
        <h2 class="step-title">方案与原型设计</h2>
        <div class="step-text">规划页面结构，制作简单原型，确定配色、排版风格。</div>
    </div>
</section>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 3</div>
        <h2 class="step-title">代码编写</h2>
        <div class="step-text">编写HTML页面，搭配CSS样式与JavaScript交互逻辑，完成前端页面。</div>
    </div>
</section>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 4</div>
        <h2 class="step-title">后端与数据库</h2>
        <div class="step-text">如有登录、上传、数据存储，配置服务端程序与数据库。</div>
    </div>
</section>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 5</div>
        <h2 class="step-title">本地测试调试</h2>
        <div class="step-text">在本地浏览器测试，修复样式错乱、交互报错，手机端适配检查。</div>
    </div>
</section>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 6</div>
        <h2 class="step-title">域名与托管准备</h2>
        <div class="step-text">注册域名，选择静态托管或者云服务器。</div>
    </div>
</section>

<section class="section">
    <div class="step-box">
        <div class="step-num">步骤 7</div>
        <h2 class="step-title">部署上线</h2>
        <div class="step-text">上传网站文件，配置域名解析，完成网站正式上线。</div>
    </div>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);
document.querySelectorAll('.step-box').forEach(box=>{
    gsap.to(box,{
        opacity:1,
        y:0,
        scale:1,
        duration:1.1,
        ease:"power2.out",
        scrollTrigger:{
            trigger:box,
            start:"top 82%",
            toggleActions:"play none none reverse"
        }
    })
})
</script>
</body>
</html>
